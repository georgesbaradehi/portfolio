  <div class="main-content" id="mainContent">
    <div class="card" id="questionCard">
      <h1 class="question"><span class="person-name">Luna</span>, veux-tu être avec moi pour la Saint-Valentin ? 💝</h1>

  <script>
        // Get name from URL parameter (?name=Luna)
        const urlParams = new URLSearchParams(window.location.search);
        let personName = urlParams.get('name') || 'Luna';
        // Capitalize first letter
        personName = personName.charAt(0).toUpperCase() + personName.slice(1).toLowerCase();
        // Update all name placeholders
        document.querySelectorAll('.person-name').forEach(el => {
            el.textContent = personName;
        });
        // Update page title
        document.title = '💕 Pour ' + personName + ' 💕';
        // Mobile Detection
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || window.innerWidth < 768;
        }
        // Show mobile warning if on mobile device
        if (isMobile()) {
            document.getElementById('mobileWarning').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
        }
        // Create floating hearts
        function createFloatingHearts() {
            const heartsBg = document.getElementById('heartsBg');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '🌹', '✨'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 8 + 's';
                heart.style.animationDuration = (6 + Math.random() * 4) + 's';
                heartsBg.appendChild(heart);
            }
        }
        createFloatingHearts();
        // No Button Escape Logic
        const noBtn = document.getElementById('noBtn');
        const card = document.getElementById('questionCard');
        let escapeDistance = 60; // Very close trigger distance
        let hasEscaped = false;
        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }
        function moveNoButton(mouseX, mouseY) {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = getDistance(mouseX, mouseY, btnCenterX, btnCenterY);
            if (distance < escapeDistance) {
                // Only set fixed position when it first escapes
                if (!hasEscaped) {
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = btnRect.left + 'px';
                    noBtn.style.top = btnRect.top + 'px';
                    hasEscaped = true;
                }
                // Calculate escape direction (away from mouse)
                const angle = Math.atan2(btnCenterY - mouseY, btnCenterX - mouseX);
                const escapeX = Math.cos(angle) * 120;
                const escapeY = Math.sin(angle) * 120;
                // Get current position
                const currentLeft = parseFloat(noBtn.style.left);
                const currentTop = parseFloat(noBtn.style.top);
                // Calculate new position
                let newLeft = currentLeft + escapeX;
                let newTop = currentTop + escapeY;
                // Keep button within viewport bounds
                const maxX = window.innerWidth - btnRect.width - 20;
                const maxY = window.innerHeight - btnRect.height - 20;
                newLeft = Math.max(20, Math.min(newLeft, maxX));
                newTop = Math.max(20, Math.min(newTop, maxY));
                noBtn.style.left = newLeft + 'px';
                noBtn.style.top = newTop + 'px';
            }
        }
        // Track mouse movement
        document.addEventListener('mousemove', (e) => {
            moveNoButton(e.clientX, e.clientY);
        });
        // Yes Button Click - Success!
        document.getElementById('yesBtn').addEventListener('click', () => {
            document.getElementById('questionCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
            noBtn.style.display = 'none';
            createConfetti();
        });
        // Create Confetti Effect
        function createConfetti() {
            const confettiContainer = document.getElementById('confetti');
            confettiContainer.style.display = 'block';
            const colors = ['#e75480', '#ff6b9d', '#ffd1dc', '#ff69b4', '#ffb6c1', '#ff1493', '#ff69b4'];
            const shapes = ['❤️', '💕', '💖', '✨', '🎉', '💗', '🌹'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.fontSize = (Math.random() * 20 + 15) + 'px';
                confettiContainer.appendChild(confetti);
            }
            // Repeat confetti a few times
            setTimeout(() => createMoreConfetti(), 1500);
            setTimeout(() => createMoreConfetti(), 3000);
        }
        function createMoreConfetti() {
            const confettiContainer = document.getElementById('confetti');
            const shapes = ['❤️', '💕', '💖', '✨', '🎉', '💗', '🌹'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 1 + 's';
                confetti.style.fontSize = (Math.random() * 20 + 15) + 'px';
                confettiContainer.appendChild(confetti);
            }
        }
        // Resize handler for mobile check
        window.addEventListener('resize', () => {
            if (isMobile()) {
                document.getElementById('mobileWarning').style.display = 'flex';
                document.getElementById('mainContent').style.display = 'none';
            } else {
                document.getElementById('mobileWarning').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
            }
        });
    </script>
