    <style>
  .corridor-wrapper {
    --tilt-x: 0;
    --tilt-y: 0;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Widened the lens slightly to show more of the grid walls */
    perspective: 400px; 
    overflow: hidden;
    z-index: 100;
  }
  /* The Camera Rig */
  .camera-rig {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    /* Increased the tilt multipliers to make the movement highly noticeable against the grid */
    transform: 
      translateZ(250px) 
      translateX(calc(var(--tilt-x) * -25px))
      translateY(calc(var(--tilt-y) * -25px))
      rotateX(calc(var(--tilt-y) * 12deg)) 
      rotateY(calc(var(--tilt-x) * 12deg));
    transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }
  /* Base for all walls */
  .plane {
    position: absolute;
    width: 400px;  
    height: 3000px; 
    left: 50%;
    top: 50%;
    margin-left: -200px; 
    margin-top: -1500px; 
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  /* The High-Contrast Grid Texture */
  .grid-surface {
    background-color: #000000;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.25) 1px, transparent 1px);
    background-size: 40px 40px; /* Size of the grid squares */
  }
  /* Constructing the Geometry */
  .floor {
    transform: rotateX(90deg) translateZ(200px); 
  }
  .ceiling {
    transform: rotateX(-90deg) translateZ(200px);
  }
  .left-wall {
    transform: rotateY(90deg) translateZ(200px);
  }
  .right-wall {
    transform: rotateY(-90deg) translateZ(200px);
  }
  /* The End of the Hallway */
  .back-wall {
    width: 400px;
    height: 400px;
    margin-top: -200px; 
    background-color: #000000;
    transform: translateZ(-1200px); 
    display: flex;
    justify-content: center;
    align-items: flex-end; 
    padding-bottom: 20px;
    box-sizing: border-box;
    /* Adding a fade-to-black vignette at the end of the tunnel to hide the hard edge */
    box-shadow: inset 0 0 150px 100px #000;
  }
  /* The Target Door */
  .door {
    width: 80px;
    height: 160px;
    background: #ffffff; 
    border-radius: 2px;
    box-shadow: 
      0 0 60px rgba(255, 255, 255, 0.3),
      inset 0 0 10px rgba(0,0,0,0.5);
    position: relative;
    cursor: pointer;
  }
  .door::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: rgba(255, 255, 255, 0.6);
    filter: blur(8px);
    z-index: -1;
  }
  .permission-btn {
    position: absolute;
    bottom: 50px;
    padding: 12px 24px;
    background: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #000;
    z-index: 200;
  }
</style>
    <div class="corridor-wrapper">
      <div class="camera-rig">
        <div class="plane grid-surface floor"></div>
        <div class="plane grid-surface ceiling"></div>
        <div class="plane grid-surface left-wall"></div>
        <div class="plane grid-surface right-wall"></div>
        <div class="plane back-wall">
          <div class="door"></div>
        </div>
      </div>
      <button class="permission-btn" id="start-btn">Enable Gyroscope</button>
    </div>
    <script>
  const wrapper = document.querySelector('.corridor-wrapper');
  const startBtn = document.getElementById('start-btn');
  let ticking = false;
  let targetX = 0;
  let targetY = 0;
  function updateTransforms() {
    wrapper.style.setProperty('--tilt-x', targetX);
    wrapper.style.setProperty('--tilt-y', targetY);
    ticking = false;
  }
  function handleOrientation(event) {
    if (event.gamma === null || event.beta === null) return;
    let x = event.gamma; 
    let y = event.beta;
    x = Math.max(-45, Math.min(45, x)); 
    y = Math.max(0, Math.min(90, y)); 
    targetX = x / 45; 
    targetY = -(y - 45) / 45; 
    if (!ticking) {
      requestAnimationFrame(updateTransforms);
      ticking = true;
    }
  }
  async function initSensors() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          startBtn.style.display = 'none';
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        startBtn.style.display = 'none';
      }
    } catch (error) {
      console.error('Sensor error:', error);
    }
  }
  startBtn.addEventListener('click', initSensors);
</script>
