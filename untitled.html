    <style>
  .interactive-3d-wrapper {
    --env-map: url('https://cdn.prod.website-files.com/692486a3b16e64066a3738b0/69971e2e7f74b32417a72508_d.jpg.webp');
    --tilt-x: 0;
    --tilt-y: 0;
    --border-thickness: 4px;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* Low brightness white / light grey */
    background-color: #d9d9d9; 
    z-index: 100;
  }
  .button-3d-container {
    position: relative;
    /* Physical rotateX and rotateY removed. Button is now strictly flat. */
  }
  .texture-btn {
    position: relative;
    width: 260px;
    height: 80px;
    border-radius: 28px;
    background-color: #0d0d0f; 
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    /* DYNAMIC 3D SHADOW REMAINS */
    box-shadow: 
      calc(var(--tilt-x) * -30px) calc(var(--tilt-y) * -30px) 40px rgba(0,0,0,0.4),
      calc(var(--tilt-x) * -10px) calc(var(--tilt-y) * -10px) 15px rgba(0,0,0,0.2),
      inset 0 1px 1px rgba(255,255,255,0.1);
    transition: box-shadow 0.1s linear;
  }
  /* 1. Main Surface Reflection */
  .surface-light {
    position: absolute;
    inset: var(--border-thickness);
    border-radius: calc(28px - var(--border-thickness));
    overflow: hidden;
    z-index: 1;
    opacity: 0.9; 
  }
  .surface-light::before {
    content: '';
    position: absolute;
    top: -100%; left: -100%; width: 300%; height: 300%;
    background-image: var(--env-map);
    background-size: cover;
    background-position: center;
    filter: blur(18px) saturate(1.2); 
    /* Texture pans dynamically based on tilt */
    transform: translate3d(
      calc(var(--tilt-x) * -20%), 
      calc(var(--tilt-y) * -20%), 
      0
    );
    transition: transform 0.1s linear;
    will-change: transform;
  }
  /* 2. The Tilted Border Reflection */
  .border-light {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: var(--border-thickness);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    z-index: 2;
    pointer-events: none;
  }
  .border-light::before {
    content: '';
    position: absolute;
    top: -100%; left: -100%; width: 300%; height: 300%;
    background-image: var(--env-map);
    background-size: cover;
    background-position: center;
    filter: blur(4px) saturate(1.4); 
    transform: rotate(25deg) translate3d(
      calc(var(--tilt-x) * -25%), 
      calc(var(--tilt-y) * -25%), 
      0
    );
    transition: transform 0.1s linear;
    will-change: transform;
  }
  .btn-text {
    position: relative;
    z-index: 3;
    color: #ffffff;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9); 
  }
  .permission-btn {
    position: absolute;
    bottom: 50px;
    padding: 12px 24px;
    background: #ffffff;
    border: 1px solid #d1d1d1;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: all 0.2s ease;
    z-index: 10;
  }

      <div class="button-3d-container" id="interactive-btn">

    <script>
  const wrapper = document.querySelector('.interactive-3d-wrapper');
  const startBtn = document.getElementById('start-btn');
  let ticking = false;
  let targetX = 0;
  let targetY = 0;
  function updateTransforms() {
    wrapper.style.setProperty('--tilt-x', targetX);
    wrapper.style.setProperty('--tilt-y', targetY);
    ticking = false;
  }
  function handleOrientation(event) {
    if (event.gamma === null || event.beta === null) return;
    let x = event.gamma; 
    let y = event.beta;
    x = Math.max(-45, Math.min(45, x)); 
    y = Math.max(0, Math.min(90, y)); 
    targetX = x / 45; 
    targetY = (y - 45) / 45; 
    if (!ticking) {
      requestAnimationFrame(updateTransforms);
      ticking = true;
    }
  }
  async function initSensors() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          startBtn.style.display = 'none';
        } else {
          alert('Motion access is required for the 3D effect.');
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        startBtn.style.display = 'none';
      }
    } catch (error) {
      console.error('Sensor initialization failed:', error);
      alert('Cannot access sensors. Ensure you are viewing this on a secure HTTPS connection.');
    }
  }
  startBtn.addEventListener('click', initSensors);
</script>
